<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDS</title>
<meta name="robots" content="noindex, nofollow">
<style>
    body {
        margin: 0;
        background: #050505;
        color: #e5e5e5;
        font-family: "Inter", sans-serif;
        overflow: hidden;
    }

    .bg {
        position: fixed;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 50% 50%, #111 0%, #050505 70%);
        animation: pulse 6s ease-in-out infinite alternate;
        z-index: -1;
    }

    @keyframes pulse {
        0% { filter: brightness(1); }
        100% { filter: brightness(1.25); }
    }

    .hero {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
        animation: fadeIn 1.2s ease forwards;
        opacity: 0;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    h1 {
        font-size: 4.2rem;
        font-weight: 900;
        margin-bottom: 12px;
        letter-spacing: -1px;
        background: linear-gradient(90deg, #ffffff, #8a8a8a);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: glow 3s ease-in-out infinite alternate;
    }

    @keyframes glow {
        0% { text-shadow: 0 0 10px #444; }
        100% { text-shadow: 0 0 28px #777; }
    }

    .tagline {
        font-size: 1.3rem;
        color: #b5b5b5;
        margin-bottom: 45px;
        max-width: 650px;
        line-height: 1.6;
        animation: fadeIn 2s ease forwards;
    }

    .cta-buttons {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .btn {
        padding: 14px 34px;
        border-radius: 12px;
        text-decoration: none;
        font-size: 1rem;
        transition: 0.25s;
        border: 1px solid #333;
        background: #0f0f0f;
        color: #e5e5e5;
        backdrop-filter: blur(4px);
        font-weight: 500;
    }

    .btn:hover {
        background: #1c1c1c;
        border-color: #555;
        transform: translateY(-3px);
        box-shadow: 0 0 14px rgba(255,255,255,0.08);
    }

    .badge {
        margin-top: 35px;
        font-size: 0.9rem;
        color: #777;
        letter-spacing: 1px;
        text-transform: uppercase;
        animation: fadeIn 2.5s ease forwards;
    }
</style>
</head>
<body>
<div class="bg"></div>
<section class="hero">
    <h1>EDS</h1>
    <div class="tagline">Edi Download Studio — Roblox Files, WordPress Themes, and More.</div>

    <div class="cta-buttons">
        <a href="https://edidownloadstudio.com" class="btn">Main Website</a>
    </div>

    <div class="badge">Powered by EDS — Edi Download Studio</div>
</section>
</body>
</html>
